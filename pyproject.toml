[build-system]
requires = ["setuptools>=61", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world"
dynamic = ["version"]
description = "Hello World reference package for CI/CD (Jenkins, Artifactory, Xray)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CI/CD Reference"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "build>=1.2",
    "flake8>=7",
    "isort>=5",
    "mypy>=1",
    "pylint>=3",
    "pytest-cov>=5",
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
hello-world = "hello_world.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>.+)$"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v*",
]
write_to = "src/hello_world/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "dist", "build", "src/hello_world/_version.py"]

[tool.pylint.main]
py-version = "3.10"
jobs = 0
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]
ignore-paths = ["src/hello_world/_version.py"]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["hello_world"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["hello_world"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
